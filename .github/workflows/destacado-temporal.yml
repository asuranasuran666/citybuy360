name: Destacado temporal (productos de poco movimiento)

on:
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:

jobs:
  destacado-temporal:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Rotar destacados temporales
        env:
          FIREBASE_URL: https://citybuy360-default-rtdb.firebaseio.com
        run: python3 scripts/destacado_temporal.py
